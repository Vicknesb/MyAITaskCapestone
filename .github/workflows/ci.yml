name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  NODE_VERSION: "20"

jobs:
  # ── Test: lint + type-check + unit tests with coverage ──────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devpulse
          POSTGRES_PASSWORD: devpulse
          POSTGRES_DB: devpulse_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://devpulse:devpulse@localhost:5432/devpulse_test
      DATABASE_URL: postgresql://devpulse:devpulse@localhost:5432/devpulse_test
      JWT_SECRET: ci-test-jwt-secret-not-for-production-use
      # base64("ci-test-encryption-key-32-bytes!") = exactly 32 bytes when decoded
      ENCRYPTION_KEY: Y2ktdGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyE=

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Upload coverage summary
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-summary
          path: coverage-summary.json
          retention-days: 30

  # ── Build: Next.js production build ─────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    env:
      DATABASE_URL: postgresql://localhost:5432/devpulse_placeholder
      JWT_SECRET: ci-build-jwt-secret-not-for-production-use
      # base64("ci-test-encryption-key-32-bytes!") = exactly 32 bytes when decoded
      ENCRYPTION_KEY: Y2ktdGVzdC1lbmNyeXB0aW9uLWtleS0zMi1ieXRlcyE=
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Production build
        run: npm run build

  # ── Security: dependency audit ───────────────────────────────────────────────
  security:
    name: Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

  # ── Deploy: production deployment ────────────────────────────────────────────
  # Runs only on push to master after all checks pass.
  # Requires these GitHub repository secrets to be configured:
  #   DATABASE_URL    — production PostgreSQL connection string
  #   JWT_SECRET      — ≥ 32-char random string (openssl rand -hex 32)
  #   ENCRYPTION_KEY  — base64-encoded 32-byte key (node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [test, build, security]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment: production

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Build for production
        run: npm run build

      # ── Add your server deployment step here ────────────────────────────────
      # Examples:
      #   rsync -az --delete .next/ user@host:/srv/devpulse/.next/
      #   docker build -t devpulse:${{ github.sha }} . && docker push ...
      #   npx railway up  /  npx fly deploy  /  npx render deploy
      - name: Deploy to server
        run: |
          echo "Deploy step not configured — add your deployment command above."
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
